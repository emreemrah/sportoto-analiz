# Render Blueprint — Spor Toto Analiz (tek servis: backend + web bir arada)
# Render panelinde "New > Blueprint" ile bu dosya otomatik okunur.
services:
  - type: web
    name: sportoto-analiz
    runtime: node
    plan: free
    region: frankfurt
    # 1) backend bağımlılıkları  2) app bağımlılıkları  3) web'i derleyip backend/public'e koy
    #    EXPO_PUBLIC_API_BASE boş => web, API'yi aynı adresten (göreli) çağırır.
    buildCommand: |
      cd backend && npm install
      cd ../app && npm install
      EXPO_PUBLIC_API_BASE= npx expo export --platform web --output-dir ../backend/public
    startCommand: cd backend && npm start
    envVars:
      # Gerçek FootyStats anahtarı panelden girilir (git'e gitmez).
      - key: FOOTYSTATS_API_KEY
        sync: false
      # API-Football (canlı skor) anahtarı — panelden girilir (git'e gitmez).
      - key: APIFOOTBALL_API_KEY
        sync: false
      # Supabase (üyelik + profil + yorum) — değerler panelden girilir, git'e gitmez.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # VERİTABANI BAĞLANTISI — ŞART. Bu değişken olmadan migration çalışmaz ve
      # ÜRETİMDE worker/scheduler'lar HİÇ BAŞLAMAZ: otomatik yenileme olmaz,
      # bülten üretilmez, uygulama "veri henüz hazır değil" der.
      # 2 Ağustos 2026'da yayındaki servis tam bu yüzden boştu: değişken
      # blueprint'te tanımlı olmadığı için panel hiç sormamıştı ve
      # /api/health "migration: yapilandirilmamis" diyordu.
      # Değer Supabase panelindeki "Session pooler" / direct bağlantı
      # dizesidir; RENDER PANELİNDEN girilir, git'e ASLA yazılmaz.
      - key: SUPABASE_DB_URL
        sync: false
      - key: FOOTYSTATS_SEASON_IDS
        value: "14972,15050,14968,14931,14956,15068,14932,14936,14987,15115,15717,14937,15047,15000,17091,16576,16263,16558,16260,16789,16242,16537,15067,16544,14231,16627,16241,16572"
      - key: REFRESH_HOURS
        value: "6"
      - key: NODE_VERSION
        value: "24"
