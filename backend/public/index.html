<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="15 maçlık haftalık bültenler için bağımsız analiz ve tahmin destek uygulaması.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Master Analiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sportoto Master Analiz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    NOT (2026-08-11): canvaskit'in Google CDN'i yerine KENDİ sunucumuzdan
    okunması, derleme sonrası `flutter_bootstrap.js` içindeki yapılandırmaya
    `useLocalCanvasKit` eklenerek sağlanır — bkz. kök dizindeki
    `flutter-web-yayinla.bat`. Buraya elle yapılandırma yazılmaz: bootstrap
    kendi kendine yüklendiği için buradaki ikinci bir `load()` çağrısı geç
    kalır ve uygulamayı iki kez başlatır (yerelde denendi, çalışmadı).
  -->
  <!--
    ESKİ SERVICE WORKER TEMİZLİĞİ (2026-08-11).

    Bu adres daha önce RN/Expo sürümünü yayınlıyordu ve o sürüm tarayıcıya bir
    service worker kaydetmişti. Kayıt, uygulama değişse bile ESKİ dosyaları
    önbellekten sunmaya devam ediyor; kullanıcı yeni sürümü hiç göremiyor
    ("çalışmıyor" şikâyeti buradan geldi). Burada BİZE AİT OLMAYAN her kayıt
    silinir, önbellekler boşaltılır ve sayfa BİR KEZ yenilenir.

    Sonsuz döngü koruması: yenileme yalnız gerçekten silinen kayıt varsa
    yapılır; temizlikten sonra kayıt kalmadığı için ikinci turda çalışmaz.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (kayitlar) {
        var yabanci = kayitlar.filter(function (k) {
          var betik = (k.active && k.active.scriptURL) || k.scope || '';
          return betik.indexOf('flutter_service_worker.js') === -1;
        });
        if (!yabanci.length) return;
        Promise.all(yabanci.map(function (k) { return k.unregister(); }))
          .then(function () {
            if (!window.caches) return null;
            return caches.keys().then(function (adlar) {
              return Promise.all(adlar.map(function (a) { return caches.delete(a); }));
            });
          })
          .then(function () { location.reload(); });
      }).catch(function () { /* eski tarayıcı: sessizce geç */ });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
