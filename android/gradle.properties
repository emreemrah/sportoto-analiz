org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# KOTLIN ARTIMLI DERLEME KAPALI — kaldırmadan önce oku.
#
# Kotlin 2.3.20 + AGP 9.0.1 birleşiminde eklenti modülleri (shared_preferences_
# android, flutter_secure_storage) her derlemede şu hatayla çöküyor:
#   "Could not close incremental caches in .../caches-jvm/jvm/kotlin:
#    class-fq-name-to-source.tab, source-to-classes.tab, ..."
#
# ELENEN OLASILIKLAR (üçü de denendi, üçü de çözmedi):
#   • bayat önbellek      → `flutter clean` sonrası TEKRARLIYOR
#   • bayat derleme daemon'ı → Gradle + Kotlin daemon'ları öldürüldü, TEKRARLIYOR
#   • yoldaki boşluk ("kodu cevir") → boşluksuz bir kopyada da TEKRARLIYOR
#
# Bu bayrakla derleme geçiyor. Maliyeti yalnız hız: eklenti Kotlin kodu zaten
# neredeyse hiç değişmez ve Gradle görev çıktısı önbelleği yürürlükte kalır.
# Kotlin sürümü yükseltildiğinde bu satırı kaldırıp DENEYİN — hata gitmişse
# bayrak da gitmeli.
kotlin.incremental=false
